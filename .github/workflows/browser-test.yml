name: Browser test (manual)

# The long walk-through in a real headless browser (software WebGL, about 25 minutes). It no longer runs on
# every push: start it by hand (Actions → Browser test (manual) → Run workflow, pick the branch) when a
# check in the browser is wanted. Screenshots and contact sheets are in the job log and the artifact.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Type-check and build
        run: npm run build
      - name: Render smoke test (real WebGL)
        run: |
          npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          node scripts/smoke-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: smoke-output/
          if-no-files-found: ignore
