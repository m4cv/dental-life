name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No lockfile is committed yet, so use install (npm ci needs package-lock.json).
      - name: Install dependencies
        run: npm install

      # "npm run build" = strict type-check (tsc -b) followed by vite build.
      - name: Type-check and build
        run: npm run build

      # Opens the production build in headless Chrome (software WebGL) and checks that the real
      # three.js scene renders. Screenshots are uploaded as an artifact. It does not block deploys.
      - name: Render smoke test (real WebGL)
        continue-on-error: true
        run: |
          npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          node scripts/smoke-test.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: smoke-output/
          if-no-files-found: ignore

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
