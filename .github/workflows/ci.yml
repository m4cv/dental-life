name: CI (branches)

# Runs on every branch except main (main has its own build-and-deploy workflow).
# Same quick checks as the deploy workflow (unit tests, type-check, build), but nothing is published.
# The long browser walk-through is no longer part of it (it took about 25 minutes): run it on demand
# with the "Browser test (manual)" workflow.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Unit tests (animation + shape maths)
        run: npm test
      - name: Type-check and build
        run: npm run build
