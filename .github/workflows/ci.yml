name: CI (branches)

# Runs on every branch except main (main has its own build-and-deploy workflow).
# Same quick checks as the deploy workflow (unit tests, type-check, build), but nothing is published.
# The long browser walk-through is no longer part of it (it took about 25 minutes): run it on demand
# with the "Browser test (manual)" workflow.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Unit tests (animation + shape maths)
        run: npm test
      - name: Type-check and build
        run: npm run build

  # The short Stage 9 browser test (about 8 minutes). Runs only when the commit message contains [lectures]
  # (the manual workflow "Browser test - lectures" does the same, but a workflow can only be started by hand
  # once its file is on main, so on a stage branch this tag is the way).
  lectures:
    if: contains(github.event.head_commit.message, '[lectures]')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Lectures browser test (real WebGL)
        env:
          LEC_DIAG: ${{ contains(github.event.head_commit.message, '[diag]') && '1' || '' }}
        run: |
          npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          node scripts/smoke-lectures.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lectures-screenshots
          path: smoke-output/
          if-no-files-found: ignore

  # The short Stage 10 browser test (about 8 minutes): the dental clinic. Runs only when the commit message contains [clinic];
  # [diag] adds a quick look at the door and the sink first (the run then stops there).
  clinic:
    if: contains(github.event.head_commit.message, '[clinic]')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Clinic browser test (real WebGL)
        env:
          CLI_DIAG: ${{ contains(github.event.head_commit.message, '[diag]') && '1' || '' }}
        run: |
          npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          node scripts/smoke-clinic.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clinic-screenshots
          path: smoke-output/
          if-no-files-found: ignore
